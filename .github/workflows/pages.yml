name: Deploy AstroFal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site/static
          cp templates/index.html _site/index.html
          cp static/styles.css static/app.js static/config.js _site/static/
          sed -i 's#href="/static/#href="./static/#g; s#src="/static/#src="./static/#g' _site/index.html
          sed -i "s#window.ASTROFAL_API_URL = '';#window.ASTROFAL_API_URL = '${ASTROFAL_API_URL:-}';#" _site/static/config.js
        env:
          ASTROFAL_API_URL: ${{ vars.ASTROFAL_API_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4